name: Update and deploy planner
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Test updater
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh official course data
        if: github.event_name != 'push'
        run: python3 scripts/update_data.py
      - name: Validate course data
        run: node scripts/validate-data.cjs
      - name: Save verified update
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Data AI program planner_files/data.js'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official course calendar data'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html _site/
          cp -R 'Data AI program planner_files' _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
